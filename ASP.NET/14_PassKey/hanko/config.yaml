# ---------------------------------------------------------------------------
# Configuration for self-hosted Hanko (development)
# Official sample: https://github.com/teamhanko/hanko/blob/main/deploy/docker-compose/config.yaml
# Full reference:  https://docs.hanko.io/setup/deployment
# ---------------------------------------------------------------------------

database:
  user: hanko
  password: hanko
  host: postgres          # the docker compose service name
  port: 5432
  database: hanko
  dialect: postgres       # Hanko supports postgres / mysql only (sqlite is not an option)

secrets:
  keys:
    # !!! Always replace this with a random string of at least 16 characters in production !!!
    # e.g. openssl rand -hex 32
    - change-me-to-a-random-secret-at-least-16-chars

service:
  name: Hanko Auth (dev)

# --- WebAuthn / passkeys ---------------------------------------------------
webauthn:
  relying_party:
    id: localhost                 # Passkeys are bound to this id; changing it invalidates existing passkeys
    display_name: Hanko Sample App
    origins:
      - http://localhost:5173     # React development server

# --- Session ----------------------------------------------------------------
session:
  lifespan: 12h
  cookie:
    name: hanko
    # false because this runs on localhost over http. Always true in production.
    secure: false
    http_only: true
    same_site: lax
    # Different ports still count as the same domain on localhost, so the cookie is
    # sent from the frontend on :5173 to the API on :5080 as well.
    domain: localhost
  # For setups where the frontend lives on a different domain, allow the token to be
  # received via the X-Auth-Token header instead of a cookie.
  enable_auth_token_header: true

# --- Login methods ----------------------------------------------------------
email:
  enabled: true
  optional: false
  acquire_on_registration: true
  use_for_authentication: true

passkey:
  enabled: true
  optional: true
  acquire_on_registration: always

password:
  enabled: false      # Disabled to keep the focus on passkeys. Set to true to allow passwords as well.

# --- Mail delivery (mailslurper, a dummy SMTP server for development) -------
email_delivery:
  enabled: true
  from_address: noreply@localhost
  from_name: Hanko Sample App
  smtp:
    host: mailslurper
    port: "2500"

# --- CORS -------------------------------------------------------------------
server:
  public:
    address: :8000
    cors:
      allow_origins:
        - http://localhost:5173
      allow_credentials: true
  admin:
    address: :8001

log:
  log_health_and_metrics: false
