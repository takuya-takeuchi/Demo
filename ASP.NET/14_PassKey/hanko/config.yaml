database:
  user: hanko
  password: hanko
  host: postgres          # the docker compose service name
  port: 5432
  database: hanko
  dialect: postgres       # Hanko supports postgres / mysql only (sqlite is not an option)

secrets:
  keys:
    # !!! Always replace this with a random string of at least 16 characters in production !!!
    # e.g. openssl rand -hex 32
    - change-me-to-a-random-secret-at-least-16-chars

service:
  name: Hanko Auth (dev)

# WebAuthn / passkeys
#
# These two are what WebAuthn checks, and both have to describe the origin the browser is on:
#   id      - the host, without scheme or port. It has to equal the origin's host or be a
#             registrable suffix of it. A bare IP address is NOT a valid id, which is why testing
#             from a phone needs a hostname (see scripts/setup-dev-https.sh).
#   origins - the full origins, scheme and port included. Checked server-side when the passkey
#             is registered.
# docker-compose.yml overrides both with WEBAUTHN_RELYING_PARTY_ID / _ORIGINS, so the values here
# are only the defaults for running on localhost.
webauthn:
  relying_party:
    id: localhost                 # Passkeys are bound to this id; changing it invalidates existing passkeys
    display_name: Hanko Sample App
    origins:
      - http://localhost:5080     # ASP.NET Core serves the SPA, the API and /auth from this one origin

# Session
session:
  lifespan: 12h
  cookie:
    name: hanko
    # false because this runs on localhost over http. Always true in production.
    secure: false
    http_only: true
    same_site: lax
    # Has to match the host the browser is on, or the cookie is dropped. Overridden by
    # SESSION_COOKIE_DOMAIN from docker-compose.yml when the app is served under a hostname.
    domain: localhost
  # For setups where the frontend lives on a different domain, allow the token to be
  # received via the X-Auth-Token header instead of a cookie.
  enable_auth_token_header: true

# Login methods
email:
  enabled: true
  optional: false
  acquire_on_registration: true
  use_for_authentication: true

passkey:
  enabled: true
  optional: true
  acquire_on_registration: always
  acquire_on_login: conditional

password:
  enabled: false      # Disabled to keep the focus on passkeys. Set to true to allow passwords as well.

mfa:
  enabled: true
  optional: true
  acquire_on_registration: true
  acquire_on_login: false
  totp:
    enabled: true     # Authentication app. Since it doesn't require WebAuthn, it works on any device.
  security_keys:
    enabled: false    # If set to `true`, the second factor via an external key or smartphone can be used.

# Mail delivery (mailslurper, a dummy SMTP server for development)
email_delivery:
  enabled: true
  from_address: noreply@localhost
  from_name: Hanko Sample App
  smtp:
    host: mailslurper
    port: "2500"

# CORS
# Unused in the default setup: the browser reaches Hanko through /auth on the app's own origin
# (YARP), so the requests Hanko sees are not cross-origin. It only matters if a browser is pointed
# at :8000 directly.
server:
  public:
    address: :8000
    cors:
      allow_origins:
        - http://localhost:5080
      allow_credentials: true
  admin:
    address: :8001

log:
  log_health_and_metrics: false
